name: Research dossier and ResearchOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_installed.py
      - run: mkdir runs
      - run: therapeutics-research analyze examples/dossier.json --output runs/fictional
      - run: therapeutics-research verify runs/fictional
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-research-dossier-${{ matrix.python }}
          path: runs/fictional
          retention-days: 7
